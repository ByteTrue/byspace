# BySpace web container: static SPA + runtime schema files.
# The image is nginxinc/nginx-unprivileged: non-root, listens on 8080.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed, immutable build output.
    location /_expo/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Runtime protocol schemas (issue 044): fetched by the app on demand.
    location /schemas/ {
        add_header Cache-Control "no-cache";
    }

    # Service worker and PWA manifest must stay fresh.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: client-side routes resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
