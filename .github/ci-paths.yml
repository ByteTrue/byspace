# Pull-request checks are routed by the behavior they prove. Package consumers
# do not inherit their dependencies' test suites; manual runs and merge-queue
# entries execute every contract regardless of these paths, while main pushes
# route exactly like pull requests.
#
# Note: dependency changes always touch package-lock.json, which the **/* globs
# below already match. Bare package.json is deliberately not routed to app/sdk/go:
# version-bump release commits ("chore(release): cut vX.Y.Z") then stay on the fast
# format/lint/typecheck track instead of re-running all 16 Playwright shards.
# A dependency or shared-config change can break any consumer, so it runs every contract. The
# **/* globs below do not match package-lock.json, which is why it needs its own entry.
workspace:
  - "package-lock.json"
  - "tsconfig.base.json"
  - "vitest.config.ts"

format:
  - ".agents/**/*.{cjs,css,html,js,json,jsonc,jsx,md,mjs,ts,tsx,yaml,yml}"
  - ".github/**/*.{cjs,css,html,js,json,jsonc,jsx,md,mjs,ts,tsx,yaml,yml}"
  - "**/*.{cjs,css,html,js,json,jsonc,jsx,md,mjs,ts,tsx,yaml,yml}"

quality:
  - "**/*.{cjs,js,json,jsx,mjs,ts,tsx}"

go:
  - "main.go"
  - "internal/**"
  - "third_party/**"
  - "workers/**"
  - "go.mod"
  - "go.sum"
  - "Makefile"

app:
  - "web/**"

sdk:
  - "packages/client/**"
  - "packages/highlight/**"
  - "packages/protocol/**"

browser:
  - "internal/**"
  - "third_party/**"
  - "packages/client/src/compat/normalize-provider-models.ts"
  - "web/**"

relay:
  - "packages/relay/**"
