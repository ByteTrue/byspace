# Pull-request checks are routed by the behavior they prove. Package consumers
# do not inherit their dependencies' test suites; manual runs and merge-queue
# entries execute every contract regardless of these paths, while main pushes
# route exactly like pull requests.
#
# Note: dependency changes always touch package-lock.json; omitting bare
# package.json from workspace keeps version-bump release commits ("chore(release): cut vX.Y.Z")
# on the fast format/lint/typecheck track instead of re-running all 16 Playwright shards.
routing:
  - ".github/actions/**"

workspace:
  - ".mise.toml"
  - ".tool-versions"
  - "package-lock.json"
  - "patches/**"
  - "tsconfig.json"
  - "tsconfig.base.json"
  - "vitest.config.ts"

ci:
  - ".github/actions/**"

format:
  - ".agents/**/*.{cjs,css,html,js,json,jsonc,jsx,md,mjs,ts,tsx,yaml,yml}"
  - ".github/**/*.{cjs,css,html,js,json,jsonc,jsx,md,mjs,ts,tsx,yaml,yml}"
  - "**/*.{cjs,css,html,js,json,jsonc,jsx,md,mjs,ts,tsx,yaml,yml}"

quality:
  - "**/*.{cjs,js,json,jsx,mjs,ts,tsx}"

go:
  - "main.go"
  - "main_android.go"
  - "cmd/**"
  - "internal/**"
  - "workers/**"
  - "go.mod"
  - "go.sum"
  - "Makefile"

app:
  - "packages/app/src/**"
  - "packages/app/package.json"

sdk:
  - "packages/client/**"
  - "packages/highlight/**"
  - "packages/protocol/**"

browser:
  - "cmd/**"
  - "internal/**"
  - "!internal/gui/**"
  - "!internal/selfupdate/**"
  - "packages/client/src/compat/normalize-provider-models.ts"
  - "packages/protocol/src/client-capabilities.ts"
  - "packages/app/src/**"
  - "packages/app/e2e/browser/**"
  - "packages/app/e2e/support/**"
  - "packages/app/assets/**"
  - "packages/app/public/**"
  - "packages/app/index.ts"
  - "packages/app/*config.{cjs,js,ts}"

relay:
  - "packages/relay/**"
