name: Docker

on:
  pull_request:
    branches: [main]
    paths:
      - "docker/**"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
      - "package.json"
      - "package-lock.json"
      - "patches/**"
      - "scripts/**"
      - "tsconfig.json"
      - "tsconfig.base.json"
      - "packages/app/**"
      - "packages/cli/**"
      - "packages/client/**"
      - "packages/expo-two-way-audio/**"
      - "packages/highlight/**"
      - "packages/plugin/**"
      - "packages/protocol/**"
      - "packages/relay/**"
      - "packages/server/**"
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      byspace_version:
        description: "Expected source version for a manual dry-run build."
        required: false
        default: ""

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      image: ${{ steps.values.outputs.image }}
      install_version: ${{ steps.values.outputs.install_version }}
      publish: ${{ steps.values.outputs.publish }}
      check_tag: ${{ steps.values.outputs.check_tag }}
      publish_tags: ${{ steps.values.outputs.publish_tags }}
      release_sha: ${{ steps.values.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - id: values
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_BYSPACE_VERSION: ${{ inputs.byspace_version }}
          REPO_OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          owner="$(printf '%s' "${REPO_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/byspace"
          package_version="$(node -p "require('./package.json').version")"
          install_version="${INPUT_BYSPACE_VERSION:-${package_version}}"
          release_sha="$(git rev-parse HEAD)"
          publish=false
          publish_latest=false

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            install_version="${REF_NAME#v}"
            publish=true
            test "${REF_NAME}" = "v${package_version}"
            test "$(git rev-list -n 1 "${REF_NAME}")" = "$release_sha"
            git fetch origin main --no-tags
            test "$release_sha" = "$(git rev-parse origin/main)"
            test -n "$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --commit "$release_sha" --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            if [[ "${REF_NAME}" != *-* ]]; then
              publish_latest=true
            fi
          fi

          check_tag="${image}:check-${GITHUB_SHA::12}"
          publish_tags="${image}:${install_version}"
          if [[ "${publish_latest}" == "true" ]]; then
            publish_tags="${publish_tags}"$'\n'"${image}:latest"
          fi

          {
            echo "image=${image}"
            echo "install_version=${install_version}"
            echo "publish=${publish}"
            echo "check_tag=${check_tag}"
            echo "release_sha=${release_sha}"
            echo "publish_tags<<EOF"
            echo "${publish_tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Resolved image=${image} install_version=${install_version} publish=${publish}"

  build:
    needs: setup
    if: needs.setup.outputs.publish != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/base/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          build-args: |
            PASEO_VERSION=${{ needs.setup.outputs.install_version }}
          tags: ${{ needs.setup.outputs.check_tag }}
          push: false
          provenance: false
          cache-from: type=gha,scope=byspace
          cache-to: type=gha,scope=byspace,mode=max

  publish:
    needs: setup
    if: needs.setup.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.release_sha }}
          persist-credentials: false

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Revalidate remote release tag before image push
        env:
          EXPECTED_SHA: ${{ needs.setup.outputs.release_sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" --force
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$EXPECTED_SHA"

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/base/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          build-args: |
            PASEO_VERSION=${{ needs.setup.outputs.install_version }}
          tags: ${{ needs.setup.outputs.publish_tags }}
          push: true
          provenance: false
          cache-from: type=gha,scope=byspace
          cache-to: type=gha,scope=byspace,mode=max

      - name: Verify multi-arch manifest and container smoke
        env:
          IMAGE: ${{ needs.setup.outputs.image }}
          VERSION: ${{ needs.setup.outputs.install_version }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2153
          image="$IMAGE:$VERSION"
          manifest="$RUNNER_TEMP/manifest.json"
          docker buildx imagetools inspect "$image" --raw > "$manifest"
          jq -e '[.manifests[].platform | "\(.os)/\(.architecture)"] | index("linux/amd64") and index("linux/arm64")' "$manifest" >/dev/null

          container="byspace-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() { docker rm -f "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name "$container" --platform linux/amd64 \
            -e PASEO_PASSWORD=byspace-ci-smoke \
            -p 127.0.0.1::6777 "$image" >/dev/null
          host_port="$(docker port "$container" 6777/tcp | sed 's/.*://')"
          for attempt in {1..60}; do
            if curl --fail --silent "http://127.0.0.1:$host_port/" >/dev/null; then
              break
            fi
            if [[ "$attempt" == 60 ]]; then
              docker logs "$container"
              exit 1
            fi
            sleep 2
          done
          docker logs "$container" 2>&1 | grep -F 'starting daemon on 0.0.0.0:6777'

      - name: Attach immutable container digest
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.setup.outputs.image }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.setup.outputs.install_version }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2153
          image="$IMAGE:$VERSION"
          digest="$(docker buildx imagetools inspect "$image" | awk '/^Digest:/ { print $2; exit }')"
          test -n "$digest"
          asset="$RUNNER_TEMP/BySpace-$VERSION-container.txt"
          printf 'image=%s\ndigest=%s\nplatforms=%s\nsource=%s\n' \
            "$image" "$digest" "$PLATFORMS" "${{ needs.setup.outputs.release_sha }}" > "$asset"
          node scripts/write-sha256.mjs "$asset"
          notes_file=".github/release/$RELEASE_TAG.md"
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            args=(release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "BySpace $RELEASE_TAG")
            [[ -f "$notes_file" ]] && args+=(--notes-file "$notes_file") || args+=(--generate-notes)
            [[ "$RELEASE_TAG" == *-* ]] && args+=(--prerelease)
            gh "${args[@]}"
          fi
          scripts/upload-release-asset.sh "$RELEASE_TAG" "$asset" "${{ needs.setup.outputs.release_sha }}"
          scripts/upload-release-asset.sh "$RELEASE_TAG" "$asset.sha256" "${{ needs.setup.outputs.release_sha }}"
