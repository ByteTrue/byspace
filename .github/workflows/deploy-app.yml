name: Deploy App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
permissions:
  actions: read
  contents: read

env:
  # The beta channel deploys the Go relay Worker, which compiles to wasm on this runner.
  GO_VERSION: "1.27.3"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact current-main CI SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          sha="$(git rev-parse HEAD)"
          git fetch origin main --no-tags
          test "$sha" = "$(git rev-parse origin/main)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "$RELEASE_TAG" = "v$version"
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$sha"
          else
            test "$GITHUB_REF" = refs/heads/main
          fi
          test -n "$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --commit "$sha" --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [[ "$version" == *-* ]]; then
            echo "RELEASE_CHANNEL=beta" >> "$GITHUB_ENV"
          else
            echo "RELEASE_CHANNEL=stable" >> "$GITHUB_ENV"
          fi
          echo "EXPECTED_SHA=$sha" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@boudra"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build app dependencies
        run: npm run build:app-deps

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Typecheck
        run: npm run typecheck --workspace=@bytetrue/app

      - name: Build Web app
        run: npm run build:web --workspace=@bytetrue/app

      # The beta channel is the Go Worker. byspace-relay-go-beta owns app-beta.byspace.cc.cd (a
      # Cloudflare custom domain routes to exactly one worker, so this cannot be a second route on
      # the TypeScript worker) and the beta PWA is served from the same origin as its relay, which is
      # what a pairing offer assumes. Deploying packages/relay here instead would silently replace
      # the beta UI with one whose relay lives on a different hostname.
      - name: Deploy the release channel
        working-directory: ${{ env.RELEASE_CHANNEL == 'beta' && 'workers/relay' || 'packages/relay' }}
        run: |
          if [[ "$RELEASE_CHANNEL" == "beta" ]]; then
            # wrangler runs the Worker's own build command, which compiles the wasm.
            npx wrangler deploy --env beta
          else
            npx wrangler deploy
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
