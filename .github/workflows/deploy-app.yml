name: Deploy App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
permissions:
  actions: read
  contents: read

env:
  # The beta channel deploys the Go relay Worker, which compiles to wasm on this runner.
  GO_VERSION: "1.27.3"

jobs:
  deploy:
    # The pairing smoke launches Playwright's Chromium, which has no Ubuntu 26.04 build; the e2e
    # job in ci.yml pins the same image for the same reason.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact current-main CI SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          sha="$(git rev-parse HEAD)"
          git fetch origin main --no-tags
          test "$sha" = "$(git rev-parse origin/main)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "$RELEASE_TAG" = "v$version"
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$sha"
          else
            test "$GITHUB_REF" = refs/heads/main
          fi
          test -n "$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --commit "$sha" --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [[ "$version" == *-* ]]; then
            echo "RELEASE_CHANNEL=beta" >> "$GITHUB_ENV"
          else
            echo "RELEASE_CHANNEL=stable" >> "$GITHUB_ENV"
          fi
          echo "EXPECTED_SHA=$sha" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@boudra"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build app dependencies
        run: npm run build:app-deps

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Typecheck
        run: npm run typecheck --workspace=@bytetrue/web

      - name: Build Web app
        run: npm run build --workspace=@bytetrue/web

      # Both channels deploy the Go Worker. This used to branch: beta went to workers/relay and
      # stable stayed on packages/relay's TypeScript worker. The split existed because the Go relay
      # was unproven; it is now measured cheaper (one idle connection held 180s: 0.06 GB-s against
      # the TypeScript worker's 1.93) and quieter, so the TypeScript Durable Object is retired and
      # one implementation serves every hostname.
      #
      # A Cloudflare custom domain routes to exactly one Worker, so `wrangler deploy` moving the
      # route is the whole cutover — and the whole rollback, if packages/relay is deployed again.
      - name: Deploy the release channel
        working-directory: workers/relay
        run: |
          if [[ "$RELEASE_CHANNEL" == "beta" ]]; then
            # wrangler runs the Worker's own build command, which compiles the wasm.
            npx wrangler deploy --env beta
          else
            npx wrangler deploy
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # A Durable Object dispatches webSocketMessage events concurrently, so a single await before
      # forwarding lets a later frame overtake an earlier one and scrambles every byte stream that
      # crosses the relay: terminal output, file-transfer chunks, tunnel data. Local workerd
      # dispatches those events serially, so no local test can see it — measured on the deployed
      # Worker, 291 of 300 back-to-back frames arrived out of place. The probe therefore has to run
      # against the build that was just deployed, and the retries cover custom-domain propagation.
      #
      # The v2 run is the path the app and daemon actually use: a control channel, a client that
      # asks the relay for a connection id, and the daemon's data socket opened with it. The v1
      # room only pairs sockets by role, so it cannot see a broken control-to-data handoff.
      - name: Verify the deployed relay preserves frame order
        run: |
          set -euo pipefail
          if [[ "$RELEASE_CHANNEL" == "beta" ]]; then
            host=app-beta.byspace.cc.cd
          else
            host=app.byspace.cc.cd
          fi
          for attempt in 1 2 3; do
            if go run ./workers/relay/probe -url "wss://$host/ws" -n 300 \
              && go run ./workers/relay/probe -url "wss://$host/ws" -n 300 -binary \
              && go run ./workers/relay/probe -url "wss://$host/ws" -n 300 -v2 \
              && go run ./workers/relay/probe -url "wss://$host/ws" -n 300 -v2 -binary; then
              exit 0
            fi
            sleep 10
          done
          echo "$host reorders frames; roll the deploy back" >&2
          exit 1

      # The probes above never load the web bundle or speak the encrypted handshake. This starts a
      # throwaway daemon against the deployed relay, opens the deployed app in a fresh browser, and
      # pairs with a password — the path every new device takes. Both halves live in the same
      # Worker, so a bundle or route problem that only exists after deploy shows up here.
      - name: Build the daemon for the pairing smoke
        run: make build

      - name: Install Playwright Chromium
        timeout-minutes: 10
        run: npx playwright install chromium

      - name: Pair a fresh browser through the deployed relay
        run: |
          set -euo pipefail
          if [[ "$RELEASE_CHANNEL" == "beta" ]]; then
            origin=https://app-beta.byspace.cc.cd
          else
            origin=https://app.byspace.cc.cd
          fi
          for attempt in 1 2; do
            if DEPLOY_WEB_ORIGIN="$origin" node scripts/deploy-pairing-smoke.mjs; then
              exit 0
            fi
            sleep 10
          done
          echo "pairing through $origin failed; roll the deploy back" >&2
          exit 1
