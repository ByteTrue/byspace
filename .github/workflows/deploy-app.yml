name: Deploy App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
permissions:
  actions: read
  contents: read

env:
  # The beta channel deploys the Go relay Worker, which compiles to wasm on this runner.
  GO_VERSION: "1.27.3"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact current-main CI SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          sha="$(git rev-parse HEAD)"
          git fetch origin main --no-tags
          test "$sha" = "$(git rev-parse origin/main)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "$RELEASE_TAG" = "v$version"
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$sha"
          else
            test "$GITHUB_REF" = refs/heads/main
          fi
          test -n "$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --commit "$sha" --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [[ "$version" == *-* ]]; then
            echo "RELEASE_CHANNEL=beta" >> "$GITHUB_ENV"
          else
            echo "RELEASE_CHANNEL=stable" >> "$GITHUB_ENV"
          fi
          echo "EXPECTED_SHA=$sha" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@boudra"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build app dependencies
        run: npm run build:app-deps

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Typecheck
        run: npm run typecheck --workspace=@bytetrue/app

      - name: Build Web app
        run: npm run build:web --workspace=@bytetrue/app

      # Both channels deploy the Go Worker. This used to branch: beta went to workers/relay and
      # stable stayed on packages/relay's TypeScript worker. The split existed because the Go relay
      # was unproven; it is now measured cheaper (one idle connection held 180s: 0.06 GB-s against
      # the TypeScript worker's 1.93) and quieter, so the TypeScript Durable Object is retired and
      # one implementation serves every hostname.
      #
      # A Cloudflare custom domain routes to exactly one Worker, so `wrangler deploy` moving the
      # route is the whole cutover — and the whole rollback, if packages/relay is deployed again.
      - name: Deploy the release channel
        working-directory: workers/relay
        run: |
          if [[ "$RELEASE_CHANNEL" == "beta" ]]; then
            # wrangler runs the Worker's own build command, which compiles the wasm.
            npx wrangler deploy --env beta
          else
            npx wrangler deploy
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
