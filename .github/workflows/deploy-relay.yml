name: Deploy Relay

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-relay-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod

      - name: Install dependencies
        run: npm ci

      - name: Verify Relay
        run: |
          npm run typecheck --workspace=@byspace/relay
          npm test --workspace=@byspace/relay

      - name: Deploy Relay Worker
        working-directory: packages/relay
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Smoke live Relay bridge
        run: npm test --workspace=@byspace/relay -- src/live-relay.e2e.test.ts
        env:
          RUN_LIVE_RELAY_E2E: "1"

      - name: Smoke live daemon, client, and CLI
        run: npm test --workspace=@byspace/client -- src/go-daemon-relay.e2e.test.ts
        env:
          RUN_LIVE_RELAY_E2E: "1"
