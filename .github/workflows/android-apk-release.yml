name: Android APK Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build (for example v0.6.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-apk-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EAS_TOKEN: ${{ secrets.EAS_TOKEN }}
      RELEASE_TAG: ${{ inputs.tag }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build workspace dependencies
        run: npm run build:app-deps

      - name: Verify Expo token
        run: |
          if [[ -z "$EAS_TOKEN" ]]; then
            echo "EAS_TOKEN is required for the Android artifact workflow." >&2
            exit 1
          fi

      - name: Validate release tag
        id: release
        shell: bash
        run: |
          node scripts/emit-release-env.mjs --source-tag "$RELEASE_TAG" > "$RUNNER_TEMP/release.env"
          source "$RUNNER_TEMP/release.env"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$SOURCE_TAG" != "$RELEASE_TAG" || "$RELEASE_VERSION" != "$package_version" ]]; then
            echo "Expected an existing v${package_version} tag, got ${SOURCE_TAG}." >&2
            exit 1
          fi
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build local production APK
        run: >-
          npx eas-cli build
          --local
          --platform android
          --profile production-apk
          --non-interactive
          --output "$RUNNER_TEMP/byspace-android.apk"

      - name: Derive artifact metadata
        id: metadata
        shell: bash
        run: |
          version="${{ steps.release.outputs.version }}"
          apk="$RUNNER_TEMP/byspace-android.apk"
          asset_name="byspace-${version}-android.apk"
          test -s "$apk"
          sha256="$(sha256sum "$apk" | cut -d ' ' -f 1)"
          bytes="$(stat -c '%s' "$apk")"
          {
            echo "version=$version"
            echo "asset_name=$asset_name"
            echo "sha256=$sha256"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Android APK"
            echo
            echo "- Version: \`$version\`"
            echo "- Asset: \`$asset_name\`"
            echo "- Bytes: \`$bytes\`"
            echo "- SHA-256: \`$sha256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage artifact
        run: cp "$RUNNER_TEMP/byspace-android.apk" "${{ steps.metadata.outputs.asset_name }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: byspace-android-${{ steps.metadata.outputs.version }}
          path: ${{ steps.metadata.outputs.asset_name }}
          if-no-files-found: error
