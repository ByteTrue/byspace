name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
    inputs:
      terminal_performance:
        description: Run the Windows terminal performance and paste validation only
        required: false
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # CI does not use the CUDA execution provider, and the onnxruntime-node
  # postinstall download from NuGet is large enough to make npm ci flaky.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      terminal_performance: ${{ github.event_name == 'workflow_dispatch' && inputs.terminal_performance == true }}
      full: ${{ inputs.terminal_performance != true && (github.event_name != 'pull_request' || steps.filter.outputs.routing != 'false' || steps.filter.outputs.workspace != 'false' || steps.filter.outputs.ci != 'false') }}
      format: ${{ inputs.terminal_performance != true && steps.filter.outputs.format != 'false' }}
      quality: ${{ inputs.terminal_performance != true && steps.filter.outputs.quality != 'false' }}
      hub: ${{ inputs.terminal_performance != true && steps.filter.outputs.hub != 'false' }}
      server: ${{ inputs.terminal_performance != true && steps.filter.outputs.server != 'false' }}
      desktop: ${{ inputs.terminal_performance != true && steps.filter.outputs.desktop != 'false' }}
      app: ${{ inputs.terminal_performance != true && steps.filter.outputs.app != 'false' }}
      sdk: ${{ inputs.terminal_performance != true && steps.filter.outputs.sdk != 'false' }}
      browser: ${{ inputs.terminal_performance != true && steps.filter.outputs.browser != 'false' }}
      relay: ${{ inputs.terminal_performance != true && steps.filter.outputs.relay != 'false' }}
      cli: ${{ inputs.terminal_performance != true && steps.filter.outputs.cli != 'false' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"

      - name: Detect affected CI contracts
        id: filter
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        with:
          filters: .github/ci-paths.yml

      - name: Validate CI contracts
        run: >-
          node --test
          scripts/ci-workflow.test.mjs
          scripts/terminal-performance-workflow.test.mjs
          scripts/daemon-launch-contract.test.mjs
          scripts/release-version-utils.test.mjs
          scripts/sync-fdroid-changelogs.test.mjs

  terminal-performance-windows:
    name: terminal-performance (windows-latest)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.terminal_performance == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PASEO_TERMINAL_PERF_E2E: "1"
      E2E_WORKERS: "1"
      PASEO_DICTATION_ENABLED: "false"
      PASEO_VOICE_MODE_ENABLED: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build workspace dependencies
        run: |
          npm run build:server
          npm run build:app-deps

      - name: Run Node daemon and PTY benchmark
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
        run: node --import tsx scripts/benchmark-terminal-latency.ts

      - name: Install Chromium
        run: npm exec -- playwright install chromium

      - name: Run Direct terminal performance
        env:
          PASEO_TERMINAL_TRANSPORT: direct
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/terminal-performance/direct/results.json
        run: >-
          npm run test:e2e --workspace=@getpaseo/app --
          e2e/browser/terminal-performance.spec.ts
          e2e/browser/terminal-keystroke-stress.spec.ts
          e2e/browser/terminal-clipboard.spec.ts
          --workers=1 --retries=0 --reporter=line,json
          --output="${{ runner.temp }}/terminal-performance/direct"

      - name: Run local Relay terminal performance
        env:
          PASEO_TERMINAL_TRANSPORT: relay
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/terminal-performance/relay/results.json
        run: >-
          npm run test:e2e --workspace=@getpaseo/app --
          e2e/browser/terminal-performance.spec.ts
          e2e/browser/terminal-keystroke-stress.spec.ts
          e2e/browser/terminal-clipboard.spec.ts
          --workers=1 --retries=0 --reporter=line,json
          --output="${{ runner.temp }}/terminal-performance/relay"

      - name: Upload terminal performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-terminal-performance-${{ github.sha }}
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/paseo-terminal-bench/**
            ${{ runner.temp }}/terminal-performance/**
          retention-days: 7

  format:
    name: format
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.format != 'false') }}
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: "npm"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Check formatting
        run: npm run format:check

  lint:
    name: lint
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.quality != 'false') }}
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: "npm"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Lint lockfile
        run: npx --yes lockfile-lint --path package-lock.json --type npm --allowed-hosts npm --validate-https --validate-integrity

      - name: Verify dependency signatures
        run: npm audit signatures

      - name: Lint
        run: npm run lint

  typecheck:
    name: typecheck
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.quality != 'false') }}
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: "npm"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Build server stack
        run: npm run build:server

      - name: Typecheck all packages
        run: npm run typecheck

      - name: Verify public package contents
        run: |
          npm pack --dry-run --ignore-scripts --workspace=@getpaseo/protocol
          npm pack --dry-run --ignore-scripts --workspace=@getpaseo/client
          npm pack --dry-run --ignore-scripts --workspace=@getpaseo/server

  release-package:
    name: release-package
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.full != 'false') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: "npm"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Build release package
        run: |
          npm run build:server
          npm run build:daemon-web-ui
          npm run release:pack:bytetrue

      - name: Install and verify consolidated package
        run: |
          set -euo pipefail
          prefix="$(mktemp -d)"
          userconfig="$RUNNER_TEMP/byspace-invalid-scope.npmrc"
          printf '%s\n' '@getpaseo:registry=https://registry.getpaseo.invalid/' > "$userconfig"
          tarball="$(find dist/npm -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$tarball"
          NPM_CONFIG_USERCONFIG="$userconfig" npm install --prefix "$prefix" --no-audit --no-fund "$tarball"
          test -x "$prefix/node_modules/.bin/byspace"
          test ! -e "$prefix/node_modules/.bin/paseo"
          actual_version="$("$prefix/node_modules/.bin/byspace" --version)"
          expected_version="$(node -p "require('./package.json').version")"
          test "$actual_version" = "$expected_version"

  server-tests-ubuntu:
    name: server-tests (ubuntu-latest)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false' || needs.changes.outputs.hub != 'false') }}
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps: &server_test_steps
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: "npm"

      - name: Fetch origin/main (worktree tests)
        if: ${{ needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false' }}
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Install agent CLIs for provider tests
        if: ${{ needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false' }}
        run: node scripts/npm-retry.mjs install -g @anthropic-ai/claude-code opencode-ai

      - name: Build server dependencies
        run: npm run build:server-deps

      - name: Run server tests
        if: ${{ needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false' }}
        run: npm run test --workspace=@getpaseo/server
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Run Hub CLI/daemon contract
        if: ${{ needs.changes.outputs.full == 'false' && needs.changes.outputs.server == 'false' && needs.changes.outputs.hub != 'false' }}
        run: npm run test:hub-cli-contract --workspace=@getpaseo/server

  server-tests-windows:
    name: server-tests (windows-latest)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false' || needs.changes.outputs.hub != 'false') }}
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps: *server_test_steps

  desktop-tests-ubuntu:
    name: desktop-tests (ubuntu-latest)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.desktop != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps: &desktop_test_steps
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: "npm"

      - name: Install dependencies with retry
        run: node scripts/npm-retry.mjs ci

      - name: Build server stack
        run: npm run build:server

      - name: Run desktop tests
        run: npm run test --workspace=@getpaseo/desktop

      - name: Install virtual display
        if: ${{ runner.os == 'Linux' }}
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth

      - name: Install Playwright browser
        if: ${{ runner.os == 'Linux' }}
        run: npx playwright install chromium

      - name: Run desktop renderer E2E
        if: ${{ runner.os == 'Linux' }}
        run: npm run test:e2e:renderer --workspace=@getpaseo/desktop

      - name: Run desktop browser E2E
        if: ${{ runner.os == 'Linux' }}
        run: npm run test:e2e:browser-tabs --workspace=@getpaseo/desktop
        env:
          PASEO_DESKTOP_BROWSER_E2E_ARTIFACT_DIR: ${{ runner.temp }}/desktop-browser-e2e

      - name: Upload desktop browser diagnostics
        uses: actions/upload-artifact@v4
        if: ${{ failure() && runner.os == 'Linux' }}
        with:
          name: desktop-browser-e2e
          path: ${{ runner.temp }}/desktop-browser-e2e
          if-no-files-found: ignore
          retention-days: 7

      - name: Build and smoke unpacked desktop app
        if: ${{ runner.os == 'Linux' }}
        run: npm run build:desktop -- --publish never --linux --x64 --dir
        env:
          EP_GH_IGNORE_TIME: true
          PASEO_DESKTOP_SMOKE: "1"
          PASEO_DESKTOP_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/desktop-smoke

      - name: Upload packaged smoke diagnostics
        uses: actions/upload-artifact@v4
        if: ${{ failure() && runner.os == 'Linux' }}
        with:
          name: desktop-packaged-smoke-linux-x64
          path: ${{ runner.temp }}/desktop-smoke
          if-no-files-found: ignore
          retention-days: 7

  desktop-tests-windows:
    name: desktop-tests (windows-latest)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.desktop != 'false') }}
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps: *desktop_test_steps

  app-tests:
    name: app-tests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.app != 'false') }}
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: "npm"

      - name: Install dependencies with retry
        run: node scripts/npm-retry.mjs ci

      - name: Install Playwright browsers
        timeout-minutes: 10
        run: npx playwright install chromium

      - name: Build app dependencies
        run: npm run build:app-deps

      - name: Run app unit tests
        run: npm run test --workspace=@getpaseo/app

  sdk-tests:
    name: sdk-tests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.sdk != 'false') }}
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: "npm"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Build client dependencies
        run: npm run build:client

      - name: Run protocol tests
        run: npm run test --workspace=@getpaseo/protocol

      - name: Run client tests
        run: npm run test --workspace=@getpaseo/client

      - name: Run highlight tests
        run: npm run test --workspace=@getpaseo/highlight

      - name: Typecheck client examples
        run: npm run typecheck:examples --workspace=@getpaseo/client

  playwright-1:
    name: playwright (shard 1/4)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.browser != 'false') }}
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      PLAYWRIGHT_SHARD: "1/4"
      PLAYWRIGHT_ARTIFACT: "1"
    steps: &playwright_test_steps
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: "npm"

      - name: Install dependencies with retry
        run: node scripts/npm-retry.mjs ci

      - name: Install Playwright browsers
        timeout-minutes: 10
        run: npx playwright install chromium

      - name: Build server stack
        run: npm run build:server

      - name: Build native app dependency
        run: npm run build --workspace=@getpaseo/expo-two-way-audio

      - name: Install agent CLIs for provider tests
        run: node scripts/npm-retry.mjs install -g @anthropic-ai/claude-code @openai/codex@0.105.0 opencode-ai

      - name: Run Playwright E2E tests
        run: npm run test:e2e --workspace=@getpaseo/app -- --shard=${{ env.PLAYWRIGHT_SHARD }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results-${{ env.PLAYWRIGHT_ARTIFACT }}
          path: |
            packages/app/test-results/
            packages/app/playwright-report/
          retention-days: 7

  playwright-2:
    name: playwright (shard 2/4)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.browser != 'false') }}
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      PLAYWRIGHT_SHARD: "2/4"
      PLAYWRIGHT_ARTIFACT: "2"
    steps: *playwright_test_steps

  playwright-3:
    name: playwright (shard 3/4)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.browser != 'false') }}
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      PLAYWRIGHT_SHARD: "3/4"
      PLAYWRIGHT_ARTIFACT: "3"
    steps: *playwright_test_steps

  playwright-4:
    name: playwright (shard 4/4)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.browser != 'false') }}
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      PLAYWRIGHT_SHARD: "4/4"
      PLAYWRIGHT_ARTIFACT: "4"
    steps: *playwright_test_steps

  relay-tests:
    name: relay-tests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.relay != 'false') }}
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: "npm"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Build relay
        run: npm run build:relay

      - name: Run relay tests
        run: npm run test --workspace=@getpaseo/relay

  cli-tests-1:
    name: cli-tests (shard 1/3)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.cli != 'false') }}
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      PASEO_LOCAL_SPEECH_AUTO_DOWNLOAD: "0"
      PASEO_DICTATION_ENABLED: "0"
      PASEO_VOICE_MODE_ENABLED: "0"
      PASEO_CLI_TEST_SHARD: "1"
      PASEO_CLI_TEST_SHARD_TOTAL: "3"
    steps: &cli_test_steps
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: "npm"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Build server stack
        run: npm run build:server

      - name: Install agent CLIs for provider tests
        run: node scripts/npm-retry.mjs install -g @anthropic-ai/claude-code @openai/codex@0.105.0 opencode-ai

      - name: Run CLI tests
        run: npm run test --workspace=@getpaseo/cli

  cli-tests-2:
    name: cli-tests (shard 2/3)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.cli != 'false') }}
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      PASEO_LOCAL_SPEECH_AUTO_DOWNLOAD: "0"
      PASEO_DICTATION_ENABLED: "0"
      PASEO_VOICE_MODE_ENABLED: "0"
      PASEO_CLI_TEST_SHARD: "2"
      PASEO_CLI_TEST_SHARD_TOTAL: "3"
    steps: *cli_test_steps

  cli-tests-3:
    name: cli-tests (shard 3/3)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.cli != 'false') }}
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      PASEO_LOCAL_SPEECH_AUTO_DOWNLOAD: "0"
      PASEO_DICTATION_ENABLED: "0"
      PASEO_VOICE_MODE_ENABLED: "0"
      PASEO_CLI_TEST_SHARD: "3"
      PASEO_CLI_TEST_SHARD_TOTAL: "3"
    steps: *cli_test_steps
