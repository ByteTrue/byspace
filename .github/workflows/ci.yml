name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # CI does not use the CUDA execution provider, and the onnxruntime-node
  # postinstall download from NuGet is large enough to make npm ci flaky.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Check formatting
        run: npx oxfmt --check .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Verify BySpace identity
        run: npm run branding:check

      - name: Lint lockfile
        run: npx --yes lockfile-lint --path package-lock.json --type npm --allowed-hosts npm --validate-https --validate-integrity

      - name: Verify dependency signatures
        run: npm audit signatures

      - name: Lint
        run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci
      - name: Build server stack
        run: npm run build:server

      - name: Typecheck all packages
        run: npm run typecheck

      - name: Verify public package contents
        run: |
          npm pack --dry-run --ignore-scripts --workspace=@bytetrue/byspace-protocol
          npm pack --dry-run --ignore-scripts --workspace=@bytetrue/byspace-client
          npm pack --dry-run --ignore-scripts --workspace=@bytetrue/byspace-server

  server-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: server-tests (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Fetch origin/main (worktree tests)
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci
      - name: Install agent CLIs for provider tests
        run: node scripts/npm-retry.mjs install -g @anthropic-ai/claude-code opencode-ai

      - name: Build server dependencies
        run: npm run build:server-deps

      - name: Run server tests
        run: npm run test --workspace=@bytetrue/byspace-server
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

  app-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies with retry
        run: node scripts/npm-retry.mjs ci
      - name: Install Playwright browsers
        timeout-minutes: 10
        run: npx playwright install chromium

      - name: Build app dependencies
        run: npm run build:app-deps

      - name: Typecheck app
        run: npm run typecheck --workspace=@bytetrue/byspace-app

      - name: Run app unit tests
        run: npm run test --workspace=@bytetrue/byspace-app

  sdk-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci
      - name: Build client dependencies
        run: npm run build:client

      - name: Run protocol tests
        run: npm run test --workspace=@bytetrue/byspace-protocol

      - name: Run client tests
        run: npm run test --workspace=@bytetrue/byspace-client

      - name: Typecheck client examples
        run: npm run typecheck:examples --workspace=@bytetrue/byspace-client

  playwright:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: "shard 1/10", shard: 1 }
          - { label: "shard 2/10", shard: 2 }
          - { label: "shard 3/10", shard: 3 }
          - { label: "shard 4/10", shard: 4 }
          - { label: "shard 5/10", shard: 5 }
          - { label: "shard 6/10", shard: 6 }
          - { label: "shard 7/10", shard: 7 }
          - { label: "shard 8/10", shard: 8 }
          - { label: "shard 9/10", shard: 9 }
          - { label: "shard 10/10", shard: 10 }
    name: playwright (${{ matrix.label }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies with retry
        run: node scripts/npm-retry.mjs ci
      - name: Install Playwright browsers
        timeout-minutes: 10
        run: npx playwright install chromium

      - name: Build app dependencies
        run: npm run build:app-deps

      - name: Build server stack
        run: npm run build:server

      - name: Install agent CLIs for provider tests
        run: node scripts/npm-retry.mjs install -g @anthropic-ai/claude-code @openai/codex@0.105.0 opencode-ai

      - name: Run Playwright E2E tests
        run: npm run test:e2e --workspace=@bytetrue/byspace-app -- --shard=${{ matrix.shard }}/10
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results-${{ matrix.shard }}
          path: |
            packages/app/test-results/
            packages/app/playwright-report/
          retention-days: 7

  relay-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Build relay
        run: npm run build:relay

      - name: Run relay tests
        run: npm run test --workspace=@bytetrue/byspace-relay

  cli-tests:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    name: cli-tests (shard ${{ matrix.shard }}/3)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Install agent CLIs for provider tests
        run: node scripts/npm-retry.mjs install -g @anthropic-ai/claude-code @openai/codex@0.105.0 opencode-ai

      - name: Run CLI tests
        run: npm run test --workspace=@bytetrue/byspace
        env:
          BYSPACE_LOCAL_SPEECH_AUTO_DOWNLOAD: "0"
          BYSPACE_DICTATION_ENABLED: "0"
          BYSPACE_VOICE_MODE_ENABLED: "0"
          BYSPACE_CLI_TEST_SHARD: ${{ matrix.shard }}
          BYSPACE_CLI_TEST_SHARD_TOTAL: "3"

  package-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Run package artifact checks
        run: npm run test:pack

      - name: Build exact-SHA release artifacts
        run: npm run pack:byspace

      - name: Verify public package release
        run: npm run release:verify

      - name: Create exact-SHA artifact manifests
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          web_artifact="artifacts/byspace-web-${version}.tgz"
          tar -czf "$web_artifact" -C packages/app dist
          node scripts/release-artifact-manifest.mjs create --kind web --artifact "$web_artifact" --manifest artifacts/web-artifact.json --commit "$RELEASE_COMMIT"
          npm_artifact="artifacts/bytetrue-byspace-${version}.tgz"
          node scripts/release-artifact-manifest.mjs create --kind npm --artifact "$npm_artifact" --manifest artifacts/npm-artifact.json --commit "$RELEASE_COMMIT"

      - name: Upload exact-SHA Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: byspace-web-app
          path: |
            artifacts/byspace-web-*.tgz
            artifacts/web-artifact.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload exact-SHA public package
        uses: actions/upload-artifact@v4
        with:
          name: byspace-npm-package
          path: |
            artifacts/bytetrue-byspace-*.tgz
            artifacts/npm-artifact.json
          if-no-files-found: error
          retention-days: 14

  distribution:
    needs: package-artifact
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Download exact-SHA public package
        uses: actions/download-artifact@v4
        with:
          name: byspace-npm-package
          path: artifacts

      - name: Verify exact-SHA public package
        run: node scripts/release-artifact-manifest.mjs verify --kind npm --manifest artifacts/npm-artifact.json --commit "${{ github.sha }}"

      - name: Install and smoke test the exact public package
        run: npm run smoke:package -- --skip-pack
