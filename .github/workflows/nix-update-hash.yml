name: Nix Verify Hash

on:
  push:
    branches: [main]
    paths:
      - "nix/**"
      - "flake.nix"
      - "flake.lock"
      - "package.json"
      - "package-lock.json"
      - "packages/highlight/**"
      - "packages/plugin/**"
      - "packages/server/**"
      - "packages/relay/**"
      - "packages/cli/**"
      - "scripts/update-nix.sh"
      - "scripts/fix-lockfile.mjs"
      - ".github/workflows/nix-update-hash.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: npm
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Verify lockfile and Nix hash
        run: |
          set -euo pipefail
          ./scripts/update-nix.sh
          if ! git diff --exit-code -- package-lock.json nix/npm-deps.hash; then
            echo "Run ./scripts/update-nix.sh and commit the updated lockfile/hash." >&2
            exit 1
          fi
      - name: Build Nix package
        run: nix build .#default -o result
