npmRebuild: false
appId: com.bytetrue.byspace.desktop
productName: BySpace
executableName: BySpace
protocols:
  - name: BySpace agent link
    schemes:
      - byspace
afterPack: ./scripts/after-pack.js
afterSign: ./scripts/after-sign.js
directories:
  output: release
files:
  - dist/**/*
  - "!**/*.map"
  - "!node_modules/@bytetrue/*/src/**"
  - "!node_modules/@bytetrue/**/*.test.*"
  - "!node_modules/@bytetrue/**/*.spec.*"
  - "!node_modules/@bytetrue/byspace-server/dist/server/web-ui/**"
  # Workspace packages are symlinked, so anything a dev generates inside them
  # lands in the asar. CI never has these; a local .debug run adds gigabytes.
  - "!node_modules/@bytetrue/*/.debug/**"
  - "!node_modules/@bytetrue/*/.tasks/**"
  - "!node_modules/@bytetrue/*/conversations/**"
  - "!node_modules/@bytetrue/*/test-results/**"
asarUnpack:
  - dist/daemon/node-entrypoint-runner.js
  - node_modules/@bytetrue/byspace-server/dist/server/terminal/shell-integration/**/*
extraResources:
  - from: ../app/dist
    to: app-dist
  - from: assets/editor-targets
    to: editor-target-icons
publish:
  provider: github
  owner: ByteTrue
  repo: byspace
mac:
  artifactName: "BySpace-${version}-${arch}.${ext}"
  category: public.app-category.developer-tools
  icon: assets/icon.icns
  hardenedRuntime: true
  notarize: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extraResources:
    - from: bin/byspace
      to: bin/byspace
    - from: assets/icon.png
      to: icon.png
  target:
    - dmg
    - zip
linux:
  category: Development
  icon: assets
  artifactName: "BySpace-${version}-${arch}.${ext}"
  maintainer: "ByteTrue"
  vendor: "BySpace"
  extraResources:
    - from: bin/byspace
      to: bin/byspace
  target:
    - AppImage
    - deb
    - rpm
    - tar.gz
appImage:
  # Keep the AppImage filename stable across versions (no ${version}) so
  # electron-updater overwrites the file in place instead of renaming it to a new
  # versioned path. A rename orphans the old binary, breaks desktop shortcuts, and
  # dangles the ~/.local/bin/byspace CLI symlink, which points at $APPIMAGE. The
  # version stays discoverable via the release tag and the in-app version.
  artifactName: "BySpace-${arch}.${ext}"
win:
  artifactName: "BySpace-Setup-${version}-${arch}.${ext}"
  icon: assets/icon.ico
  extraResources:
    - from: bin/byspace.cmd
      to: bin/byspace.cmd
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
