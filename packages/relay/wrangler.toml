name = "byspace-relay"
main = "src/cloudflare-adapter.ts"
compatibility_date = "2024-12-01"
workers_dev = false
preview_urls = false

routes = [{ pattern = "relay.byspace.cc.cd", custom_domain = true }]

[observability]
enabled = true

[[durable_objects.bindings]]
name = "RELAY"
class_name = "RelayDurableObject"

# Stable account-local namespace derived from "byspace-relay-ingress-v1".
[[ratelimits]]
name = "RELAY_RATE_LIMITER"
namespace_id = "791437345"

[ratelimits.simple]
limit = 120
period = 60

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayDurableObject"]
