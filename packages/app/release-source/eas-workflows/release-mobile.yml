# INACTIVE SOURCE REFERENCE: this file is outside .eas/workflows and cannot run automatically.
# Active CD publishes signed Android APKs via .github/workflows/client-release.yml and never builds iOS.

name: Release Mobile
on:
  workflow_dispatch: {}

jobs:
  build_android:
    name: Build Android Production
    type: build
    params:
      platform: android
      profile: production

  build_ios:
    name: Build iOS Production
    type: build
    params:
      platform: ios
      profile: production

  submit_android:
    name: Submit Android
    type: submit
    needs: [build_android]
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: production

  submit_ios:
    name: Submit iOS
    type: submit
    needs: [build_ios]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production

  submit_ios_review:
    name: Submit iOS Review
    type: maestro
    needs: [submit_ios]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      flow_path: [maestro/release/submit-ios-review.yml]
