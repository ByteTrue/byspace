# INACTIVE SOURCE REFERENCE: this file is outside .eas/workflows and cannot run automatically.
# BySpace retains iOS source/prebuild/test support but active CD never builds, submits, or uploads iOS.

name: Release iOS Beta
on:
  workflow_dispatch: {}

jobs:
  build_ios:
    name: Build iOS Production
    type: build
    params:
      platform: ios
      profile: production

  submit_ios:
    name: Submit iOS to TestFlight
    type: submit
    needs: [build_ios]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
