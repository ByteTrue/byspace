pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{cjs,css,html,js,json,jsonc,jsx,md,mjs,ts,tsx,yaml,yml}"
      # Same as ignorePatterns in .oxfmtrc.json: oxfmt exits non-zero when every passed path is
      # ignored, so staging a file under an ignored tree failed the hook instead of skipping it.
      # scripts/repo-config.test.mjs checks this list covers that one.
      exclude:
        - "*.lock"
        - "**/*.gen.ts"
        - "**/*.gen.tsx"
        - "web/public/schemas/*.json"
        - "bywork/**"
        - "design/references/**"
        - "design/sheet-assets/**"
        - "design/component-sheet.html"
        - "web/src/ui/**"
        - "web/src/styles/shadcn-tailwind.css"
      run: npm run format:check:files -- {staged_files}
    - name: lint
      glob: "*.{cjs,js,jsx,mjs,ts,tsx}"
      # Same as ignorePatterns in .oxlintrc.json: oxlint exits non-zero when every passed path is ignored.
      exclude:
        - ".dev/**"
        - "bywork/archive/**"
        - "design/references/**"
        - "web/src/ui/**"
        - "web/src/styles/shadcn-tailwind.css"
      run: npm run lint -- {staged_files}
    - name: gofmt
      glob: "*.go"
      # npm run format is oxfmt, which does not read Go. CI's format job runs gofmt over these same
      # roots; without this job a Go change commits unformatted and only CI catches it.
      # lefthook wraps the run string in sh -c "..." without escaping inner double quotes,
      # so any quoted shell here breaks the wrapper. Keep the run quote-free: gofmt -l prints
      # the offenders and exits 0, -e turns a non-empty listing into the failure.
      run: gofmt -l -e {staged_files}
    - name: typecheck
      run: npm run typecheck
