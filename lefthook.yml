pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{css,js,json,jsonc,jsx,md,ts,tsx,yaml,yml}"
      exclude:
        - "package-lock.json"
        - "**/package-lock.json"
      run: npm run format:check:files -- {staged_files}
    - name: lint
      glob: "*.{js,jsx,ts,tsx}"
      # Same as ignorePatterns in .oxlintrc.json: oxlint exits non-zero when every passed path is ignored.
      exclude:
        - "design/references/**"
      run: npm run lint -- {staged_files}
    - name: typecheck
      run: npm run typecheck
